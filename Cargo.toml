[package]
name = "aether-relay"
version = "0.2.0"
edition = "2024"
authors = ["Schnee <schnee@users.noreply.github.com>", "Shorekeeper"]
description = "High-Performance Webhook Ingestion & Reliable Dispatch Gateway in Rust"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
subtle = "2.6.1"
ed25519-dalek = "3.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rand = "0.10.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
